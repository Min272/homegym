plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homegym.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.homegym.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Khóa debug cố định: các bản APK từ GitHub Actions cài đè được lên nhau, không mất dữ liệu.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    androidResources {
        noCompress 'html'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
